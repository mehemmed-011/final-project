<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maga Store</title>
    <link rel="icon" href="./image/letter-m.png" type="image/x-icon" />
    <link rel="stylesheet" href="./login.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <a href="./index.html" class="logo">MAGA<span class="logo2">STORE</span></a>
        <nav class="menu">
          <a href="./index.html" class="nav-a">Ana səhifə</a>
          <a href="./products.html" class="nav-a">Məhsullar</a>
          <a href="./about.html" class="nav-a">Haqqımızda</a>
          <a href="./contact.html" class="nav-a">Əlaqə</a>
        </nav>
        <div class="nav-actions">
          <a href="./cart.html" class="cart-btn"><img src="./image/cart.svg" class="cart" alt="cart"><span class="cart-count">0</span></a>
          <a href="./login.html" class="login-btn">Daxil ol</a>
          <a href="./auth.html" class="user-icon"><img class="user-icon-img" src="./image/user-icon.svg" alt="user-icon"></a>
          <img src="./image/bars.svg" class="bars" alt="bars">
        </div>
      </div>
    </header>

    <div class="menu-phone">
      <a href="./index.html" class="nav-a active">Ana səhifə</a>
      <a href="./products.html" class="nav-a">Məhsullar</a>
      <a href="./about.html" class="nav-a">Haqqımızda</a>
      <a href="./contact.html" class="nav-a">Əlaqə</a>
    </div>

    <main>
      <section class="auth-container">
        <div class="auth-cards">
          <div class="auth-tabs">
            <button class="auth-tab login active-tab">Giriş</button>
            <button class="auth-tab signup">Qeydiyyat</button>
          </div>

          <form id="login-form" class="auth-form">
            <label>Email
              <input class="login-email" type="email" required placeholder="email@example.com"/>
            </label>
            <label>Şifrə
              <input class="login-password" type="password" required placeholder="••••••••"/>
            </label>
            <button class="login-button" type="submit">Daxil ol</button>
          </form>

          <form id="signup-form" class="auth-form hidden">
            <label>Ad Soyad
              <input class="signup-name" type="text" required/>
            </label>
            <label>Email
              <input class="signup-email" type="email" required/>
            </label>
            <label>Şifrə
              <input class="signup-password" type="password" required/>
            </label>
            <button class="signup-button" type="submit">Qeydiyyatdan keç</button>
          </form>
        </div>
      </section>
    </main>


    <!-- footer  -->

    <footer>
      <div class="footer-boxes">
        <div class="footer-box">
          <h3 h3 class="logo1-f">MAGA<span class="logo2-f">STORE</span></h3>
          <p>Etibarlı texnologiya mağazası</p>
        </div>
        <div class="footer-box">
          <h4 class="footer-h4">Mağaza</h4>
          <a href="products.html">Məhsullar</a>
          <a href="products.html?cat=smartphones">Smartfonlar</a>
          <a href="products.html?cat=laptops">Noutbuklar</a>
        </div>
        <div class="footer-box">
          <h4 class="footer-h4">Şirkət</h4>
          <a href="about.html">Haqqımızda</a>
          <a href="contact.html">Əlaqə</a>
        </div>
        <div class="footer-box">
          <h4 class="footer-h4">Bizi izləyin</h4>
          <div class="social">
            <a href="https://www.instagram.com/1brah1m0v_011?igsh=dmVxOXRwNG8xNXly" target="_blank">
              <img src="./image/instagram-icon.svg" alt="instagram-icon">
            </a>
            <a href="https://www.facebook.com/share/1G3UftN7m4/" target="_blank">
              <img src="./image/facebook-icon.svg" alt="facebook-icon">
            </a>
            <a href="https://www.linkedin.com/in/m%C9%99h%C9%99mm%C9%99d-ibrahimli-a560a5385?utm_source=share_via&utm_content=profile&utm_medium=member_android" target="_blank">
              <img src="./image/linkedin-icon.svg" alt="linkedin-icon">
            </a>
          </div>
        </div>
      </div>
      <div class="footer-bottom">© 2026 MagaStore. Bütün hüquqlar qorunur.</div>
    </footer>

    <script src="./script.js"></script>
    <script src="./cart.js"></script>
  </body>
</html>
