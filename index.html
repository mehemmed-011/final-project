<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maga Store</title>
    <!-- <link rel="icon" href="m.ico" type="image/x-icon" /> -->
    <link rel="stylesheet" href="./style.css" />
    <!-- <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    /> -->
  </head>
  <body>
    <!-- header hissə -->
    <header>
      <div class="container">
        <a href="./index.html" class="logo">MAGA<span class="logo2">STORE</span></a>
        <nav class="menu">
          <a href="./index.html" class="nav-a active">Ana səhifə</a>
          <a href="./products.html" class="nav-a">Məhsullar</a>
          <a href="./about.html" class="nav-a">Haqqımızda</a>
          <a href="./contact.html" class="nav-a">Əlaqə</a>
        </nav>
        <div class="nav-actions">
          <a href="./cart.html" class="cart-btn"><img src="./image/cart.svg" class="cart" alt="cart"><span class="cart-count">0</span></a>
          <a href="./login.html" class="login-btn">Daxil ol</a>
          <img src="./image/bars.svg" class="bars" alt="bars">
        </div>
      </div>
    </header>

    <!-- section 1 -->

    <section class="first-section">
      <div class="first-boxes">
        <div class="first-box">
          <h1 class="first-h1">Texnologiya yaxınınızda</h1>
          <p class="first-p">Smartfonlar, noutbuklar və aksesuarlar — keyfiyyətli məhsullar əlverişli qiymətə.</p>
          <a href="./products.html" class="first-btn">Alış-verişə başla</a>
        </div>
        <img src="./image/logoimg.png" class="logo-img" alt="logoimg">
      </div>
    </section>

    <!-- section 2 -->

    <section class="second-section">
      <div class="second-boxes">
        <h2 class="second-h2">Kateqoriyalar</h2>
        <div class="second-box">
          <a href="products.html?cat=smartphones" class="cat-card">
            <img src="./image/smartphone.png" class="cat-icon" alt="icon">
            <h3 class="second-h3">Smartfonlar</h3>
            <p class="second-p">Ən son modellər</p>
          </a>
          <a href="products.html?cat=laptops" class="cat-card">
            <img src="./image/laptop.png" class="cat-icon" alt="icon">
            <h3 class="second-h3">Noutbuklar</h3>
            <p class="second-p">İş və oyun üçün</p>
          </a>
          <a href="products.html?cat=mobile-accessories" class="cat-card">
            <img src="./image/headphone.png" class="cat-icon" alt="icon">
            <h3 class="second-h3">Aksesuarlar</h3>
            <p class="second-p">Mobil aksesuarlar</p>
          </a>
        </div>
      </div>
    </section>

  </body>
</html>
